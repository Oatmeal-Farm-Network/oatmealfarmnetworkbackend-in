name: Deploy Main Backend (India) to Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - "saige/**"
      - ".github/workflows/deploy-saige.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
  REGION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
  GAR_REPOSITORY: cloud-run-source-deploy
  SERVICE_NAME: oatmealfarmnetworkbackend-in
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME
          docker build \
            -t $IMAGE:$GITHUB_SHA \
            -t $IMAGE:latest \
            .

      - name: Push Docker image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Write Cloud Run env file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          VERTEX_AI_MODEL: ${{ secrets.VERTEX_AI_MODEL }}
          FIRESTORE_DATABASE: ${{ secrets.FIRESTORE_DATABASE }}
          DB_TYPE: ${{ secrets.DB_TYPE }}
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -z "$DB_SERVER" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$DB_NAME" ]; then
            echo "ERROR: DB_SERVER/DB_USER/DB_PASSWORD/DB_NAME secrets are required."
            echo "Without DB_SERVER the app connects to localhost and Cloud Run fails."
            exit 1
          fi

          FE_URL="${FRONTEND_URL:-https://placeholder.invalid}"
          # YAML env file avoids shell escaping issues (e.g. ! in passwords)
          python3 - <<'PY'
          import os
          pairs = {
            "FRONTEND_URL": os.environ.get("FRONTEND_URL") or "https://placeholder.invalid",
            "GOOGLE_CLOUD_PROJECT": os.environ["PROJECT_ID"],
            "GOOGLE_CLOUD_LOCATION": os.environ["REGION"],
            "DB_TYPE": os.environ.get("DB_TYPE") or "sqlserver",
            "DB_SERVER": os.environ["DB_SERVER"],
            "DB_PORT": os.environ.get("DB_PORT") or "1433",
            "DB_USER": os.environ["DB_USER"],
            "DB_PASSWORD": os.environ["DB_PASSWORD"],
            "DB_NAME": os.environ["DB_NAME"],
            "DB_LOGIN_TIMEOUT": "3",
            "DB_QUERY_TIMEOUT": "10",
          }
          optional = [
            "GOOGLE_API_KEY", "GEMINI_MODEL", "VERTEX_AI_MODEL",
            "FIRESTORE_DATABASE", "SECRET_KEY",
          ]
          for k in optional:
            v = os.environ.get(k) or ""
            if v:
              pairs[k] = v

          # Force FRONTEND_URL from workflow env
          pairs["FRONTEND_URL"] = os.environ.get("FRONTEND_URL") or pairs["FRONTEND_URL"]

          def yaml_escape(s: str) -> str:
            return '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"'

          with open("cloudrun-env.yaml", "w", encoding="utf-8") as f:
            for k, v in pairs.items():
              f.write(f"{k}: {yaml_escape(v)}\n")
          print("Wrote cloudrun-env.yaml with keys:", ", ".join(pairs.keys()))
          print("DB_SERVER length:", len(pairs["DB_SERVER"]))
          PY

      - name: Deploy to Cloud Run
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 10 \
            --project $PROJECT_ID \
            --env-vars-file cloudrun-env.yaml

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --project $PROJECT_ID \
            --format 'value(status.url)')
          echo "India backend deployed at: $URL"
          echo "Add/update GitHub secret BACKEND_URL=$URL on the frontend repo"
